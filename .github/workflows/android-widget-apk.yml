name: Android Widget APK

on:
  push:
    branches:
      - feature/android-quick-actions-widget
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build debug APK
        run: bun run mobile:build:android:debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-widget-debug-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
